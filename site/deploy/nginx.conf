# HTTP: serve the ACME challenge, redirect everything else
server {
    listen 80;
    server_name hr-payrollsystem.com www.hr-payrollsystem.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://hr-payrollsystem.com$request_uri; }
}

# Canonical host: www redirects to the apex so links and analytics stay in one place
server {
    listen 443 ssl;
    http2 on;
    server_name www.hr-payrollsystem.com;
    ssl_certificate     /etc/letsencrypt/live/hr-payrollsystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr-payrollsystem.com/privkey.pem;
    return 301 https://hr-payrollsystem.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hr-payrollsystem.com;

    ssl_certificate     /etc/letsencrypt/live/hr-payrollsystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr-payrollsystem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    # --- security headers -------------------------------------------------
    # HSTS: start with a short max-age. Once you are certain TLS will never
    # lapse, raise it to 31536000 and add preload. Setting a long max-age too
    # early locks visitors out if the certificate ever fails.
    add_header Strict-Transport-Security "max-age=86400; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The interactive product demo, served as a static file
    location = /demo { try_files /demo/index.html =404; }

    location / { try_files $uri $uri/ $uri.html =404; }

    gzip on;
    gzip_types text/css application/javascript text/html application/json image/svg+xml;

    location ~* \.(css|js|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location = /index.html { expires -1; }

    access_log /var/log/nginx/access.log;
}
