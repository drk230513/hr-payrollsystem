# Behind Cloudflare Tunnel: TLS is terminated at the edge, so plain HTTP here.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare sets the real client address here. Without this every log line
    # shows the tunnel's address and rate limiting becomes useless.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; # The enquiry form posts to Formspree. Without it in connect-src the
    # browser blocks the request before it leaves the page, and the failure
    # has no status and no body — it looks like an outage, not a policy.
    connect-src 'self' https://cloudflareinsights.com https://formspree.io; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS is set by Cloudflare at the edge, not here.

    location = /demo { try_files /demo/index.html =404; }
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location / { try_files $uri $uri/ $uri.html =404; }

    gzip on;
    gzip_types text/css application/javascript text/html application/json image/svg+xml;
    location ~* \.(css|js|woff2?)$ { expires 30d; add_header Cache-Control "public, immutable"; }
    location = /index.html { expires -1; }
}
