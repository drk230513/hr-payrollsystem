<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR &amp; Payroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style id="appstyle">
:root{
  --ground:#E4E7EC; --card:#FFFFFF;
  --ink:#14181F; --ink2:#59616F; --ink3:#828A97;
  --rule:#CBD1DA; --rule-strong:#A6AEBB; --navy:#1B3A6B;
  --high:#9E1C1C; --high-bg:#FAEBEA;
  --med:#8A5200;  --med-bg:#FAF2E4;
  --low:#3A4658;  --low-bg:#EDF0F3;
  --go:#1D6A47;   --go-bg:#E7F2EC;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px 72px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink2)}
h2{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.11em;text-transform:uppercase;margin:0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin:34px 0 10px}
.row-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.topbar{background:var(--ink);color:#fff;position:sticky;top:0;z-index:40}
.topbar-in{max-width:1080px;margin:0 auto;padding:0 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;min-height:56px}
.brand{font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--ink3);font-weight:600}
.tabs{display:flex;margin-left:auto;flex-wrap:wrap}
.tab{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;background:none;border:none;border-bottom:2px solid transparent;color:#9AA2B0;padding:18px 13px 16px;cursor:pointer}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:#fff}
.tab:focus-visible{outline:2px solid #fff;outline-offset:-3px}

.masthead{background:var(--card);border:1px solid var(--rule);border-top:3px solid var(--ink);padding:22px 24px 0;margin-top:26px}
.mast-top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.mast-ref{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.mast-ref b{color:var(--ink);font-weight:500}
.mast-body{display:flex;flex-wrap:wrap;gap:26px;justify-content:space-between;align-items:flex-end;padding:20px 0 22px}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.02;letter-spacing:-.015em;margin:6px 0 0;max-width:16ch}
.mast-figs{display:flex;gap:28px;flex-wrap:wrap}
.fig-l{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);margin-bottom:3px}
.fig-v{font-family:var(--mono);font-size:19px;font-weight:500}

.meter-wrap{border-top:1px solid var(--rule);margin:0 -24px;padding:16px 24px 20px}
.meter-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.meter-status{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--high);flex:none}
.meter-status.is-open{color:var(--go)} .meter-status.is-open .dot{background:var(--go)}
.meter-note{font-size:13px;color:var(--ink2);max-width:62ch}
.segbar{display:flex;gap:3px;height:12px}
.seg{flex:1;background:var(--rule);transition:background .3s ease}
.seg.d-hold{background:var(--high)} .seg.d-release{background:var(--go)} .seg.d-dismiss{background:var(--rule-strong)}

.counters{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-top:none;background:var(--card)}
.counter{padding:14px 18px;border-left:1px solid var(--rule)}
.counter:first-child{border-left:none}
.c-v{font-family:var(--mono);font-size:21px;font-weight:500;line-height:1.15}
.c-l{font-size:12px;color:var(--ink2);margin-top:2px}

.btn{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;padding:9px 15px;background:var(--card);border:1px solid var(--rule-strong);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink);background:#F5F7F9}
.btn:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:11.5px}

.ledger{background:var(--card);border:1px solid var(--rule)}
.prow{display:grid;grid-template-columns:1fr 130px 130px auto;gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--rule)}
.prow:last-child{border-bottom:none}
.prow.head{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);background:#F4F6F8}
.prow .m{font-family:var(--mono);font-size:13px}
.prow.muted{opacity:.45}
.r-sub{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-top:2px;display:block}
.status{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;display:inline-block}
.st-approved{background:var(--go-bg);color:var(--go)}
.st-pending{background:var(--med-bg);color:var(--med)}
.st-taken{background:var(--low-bg);color:var(--low)}

.row{border-bottom:1px solid var(--rule)} .row:last-child{border-bottom:none}
.row-btn{display:grid;grid-template-columns:56px 62px 1fr auto 22px;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:none;font:inherit;color:inherit;padding:14px 18px;cursor:pointer}
.row-btn:hover{background:#F5F7F9}
.row-btn:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
.r-ref{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
.chip{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:3px 0;text-align:center}
.chip.high{background:var(--high-bg);color:var(--high)}
.chip.med{background:var(--med-bg);color:var(--med)}
.chip.low{background:var(--low-bg);color:var(--low)}
.r-title{font-weight:500;line-height:1.35}
.r-amt{font-family:var(--mono);font-size:14px;white-space:nowrap}
.r-amt.nil{color:var(--ink2)}
.chev{font-family:var(--mono);color:var(--ink2);transition:transform .2s ease;justify-self:end}
.row.open .chev{transform:rotate(90deg)}
.detail{display:none;padding:2px 18px 20px 70px;border-top:1px dashed var(--rule)}
.row.open .detail{display:block}
.p-block{margin-top:15px}
.p-l{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);margin-bottom:5px}
.p-t{max-width:66ch}
.evidence{font-family:var(--mono);font-size:12.5px;line-height:1.85;background:#F4F6F8;border-left:2px solid var(--rule-strong);padding:11px 14px}
.evidence span{color:var(--ink2)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.decided{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink2);margin-top:18px;padding:10px 13px;background:#F4F6F8}
.decided b{font-weight:600;color:var(--ink)}
.undo{background:none;border:none;padding:0;font:inherit;color:var(--navy);text-decoration:underline;cursor:pointer}
.row.settled .r-title{color:var(--ink2)}
.row.settled .chip{opacity:.45}

.panelbox{background:var(--card);border:1px solid var(--rule);padding:20px 22px}
.frow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.inline{flex-direction:row;align-items:center}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
.field input,.field select{font-family:var(--mono);font-size:14px;padding:8px 10px;border:1px solid var(--rule-strong);background:#fff;color:var(--ink);width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--navy);outline-offset:0}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px}
.fs h4{font-family:var(--cond);font-weight:700;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;margin:0 0 10px;padding-bottom:5px;border-bottom:1px solid var(--rule);color:var(--ink2)}
.fs .field{margin-bottom:11px}
.calcbox{margin-top:18px;border-top:1px dashed var(--rule);padding-top:16px;display:none}
.calcbox.show{display:block}
.calcline{font-family:var(--mono);font-size:12.5px;line-height:1.9;display:flex;justify-content:space-between;gap:20px;max-width:520px}
.calcline span:first-child{color:var(--ink2)}
.calcline.total{border-top:1px solid var(--rule);margin-top:7px;padding-top:7px;font-weight:600}
.calcline.total span:first-child{color:var(--ink)}
.flag{margin-top:14px;padding:11px 14px;font-size:13.5px;border-left:2px solid var(--med);background:var(--med-bg);max-width:74ch}
.flag.bad{border-left-color:var(--high);background:var(--high-bg)}
.flag.ok{border-left-color:var(--go);background:var(--go-bg)}

.gov{margin-top:30px;background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--navy);padding:18px 22px}
.gov p{margin:8px 0 0;font-size:13.5px;color:var(--ink2);max-width:80ch}
.gov strong{color:var(--ink);font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(20,24,31,.62);display:none;z-index:60;padding:24px;overflow:auto}
.scrim.show{display:block}
.modal{background:#fff;max-width:820px;margin:0 auto;border-top:3px solid var(--ink)}
.modal-bar{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--rule);background:#F4F6F8;position:sticky;top:0;z-index:2}
.modal-acts{display:flex;gap:8px;flex-wrap:wrap}
#modalBody{padding:0}
#modalBody .formgrid{padding:22px}

.slip{padding:30px 34px 36px;font-size:13.5px}
.slip-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
.slip-org{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:-.01em;text-transform:uppercase;line-height:1.05}
.slip-sub{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:7px;line-height:1.6}
.slip-meta{font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:right;line-height:1.8}
.slip-id{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:15px 0;border-bottom:1px solid var(--rule)}
.slip-id div span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.slip-id div b{font-family:var(--mono);font-size:13px;font-weight:500}
.slip-cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:18px 0}
.slip-col h4{font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
.sl{display:flex;justify-content:space-between;gap:14px;font-family:var(--mono);font-size:12.5px;line-height:2}
.sl span:first-child{color:var(--ink2)}
.sl.tot{border-top:1px solid var(--rule);margin-top:6px;padding-top:6px;font-weight:600}
.sl.tot span:first-child{color:var(--ink)}
.slip-net{display:flex;justify-content:space-between;align-items:baseline;gap:20px;background:var(--ink);color:#fff;padding:14px 20px;margin-top:6px}
.slip-net .l{font-family:var(--cond);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.slip-net .v{font-family:var(--mono);font-size:24px;font-weight:500}
.slip-ytd{margin-top:20px;border:1px solid var(--rule)}
.slip-ytd .yr{display:grid;grid-template-columns:repeat(5,1fr);font-family:var(--mono);font-size:12px}
.slip-ytd .yr div{padding:9px 12px;border-left:1px solid var(--rule)}
.slip-ytd .yr div:first-child{border-left:none}
.slip-ytd .yr.h div{background:#F4F6F8;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2)}
.slip-foot{margin-top:18px;font-size:11px;color:var(--ink2);line-height:1.75;border-top:1px solid var(--rule);padding-top:12px}

@media (max-width:820px){
  .counters{grid-template-columns:repeat(2,1fr)}
  .counter:nth-child(3){border-left:none}
  .counter:nth-child(n+3){border-top:1px solid var(--rule)}
  .prow{grid-template-columns:1fr auto;row-gap:6px}
  .prow.head{display:none}
  .row-btn{grid-template-columns:50px 1fr 22px;row-gap:6px}
  .chip{grid-column:1;text-align:left}
  .r-title{grid-column:2/4} .r-amt{grid-column:2/4;font-size:13px}
  .chev{grid-row:1;grid-column:3}
  .detail{padding-left:18px}
  .slip-id,.slip-cols,.slip-ytd .yr{grid-template-columns:1fr 1fr}
  .slip{padding:20px}
  .mast-figs{gap:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .topbar,.modal-bar,.wrap{display:none!important}
  body{background:#fff}
  .scrim{position:static;display:block!important;padding:0;background:none;overflow:visible}
  .modal{max-width:none;border:none}
}

/* integrations + hints */
.hint{font-size:11.5px;color:var(--ink3);line-height:1.5;margin-top:-4px}
.intcard{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--navy);padding:22px 24px;margin-bottom:16px}
.int-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.int-name{font-family:var(--cond);font-weight:700;font-size:18px;letter-spacing:-.01em}
.int-sub{font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-top:3px}
.int-body{font-size:14px;color:var(--ink2);max-width:76ch;margin:16px 0 0}
.int-body b{color:var(--ink);font-weight:600}
.int-split{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:20px}
.ticks,.crosses{list-style:none;margin:0;padding:0;font-size:13.5px}
.ticks li,.crosses li{padding:4px 0 4px 22px;position:relative;color:var(--ink2)}
.ticks li:before{content:"✓";position:absolute;left:0;color:var(--go);font-weight:600}
.crosses li:before{content:"✕";position:absolute;left:0;color:var(--high);font-weight:600}
@media (max-width:760px){ .int-split{grid-template-columns:1fr;gap:18px} }

/* automation */
.modeswitch{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--rule);background:var(--card)}
.modebtn{text-align:left;background:none;border:none;border-left:1px solid var(--rule);padding:16px 18px;cursor:pointer;font:inherit;color:inherit}
.modebtn:first-child{border-left:none}
.modebtn:hover{background:#F5F7F9}
.modebtn.on{background:var(--ink);color:#fff}
.modebtn.on .mb-n{color:#A8B0BC}
.modebtn:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
.mb-l{display:block;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.mb-n{display:block;font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.5}
.rulerow{align-items:start}
.rulerow select{font-family:var(--mono);font-size:12.5px;padding:6px 8px;border:1px solid var(--rule-strong);background:#fff}
.rulerow select:disabled{opacity:.45}
.lockednote{margin-top:8px;padding:8px 11px;background:var(--med-bg);border-left:2px solid var(--med);font-size:12.5px;color:var(--ink2);max-width:70ch}
.rulegroup .p-l{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
@media (max-width:760px){ .modeswitch{grid-template-columns:1fr}
  .modebtn{border-left:none;border-top:1px solid var(--rule)} .modebtn:first-child{border-top:none} }

/* site footer */
.sitefoot{border-top:1px solid var(--rule);background:var(--card);margin-top:auto}
.sitefoot-in{max-width:1080px;margin:0 auto;padding:20px 22px;display:flex;justify-content:space-between;
  gap:14px;flex-wrap:wrap;align-items:baseline}
.sf-brand{font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.sf-brand b{color:var(--ink);font-weight:700}
.sf-note{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.02em}
body{display:flex;flex-direction:column;min-height:100vh}
.wrap{flex:1 0 auto;width:100%}
@media (max-width:600px){ .sitefoot-in{flex-direction:column;gap:6px} }
@media print{ .sitefoot{display:none!important} }
.slip-producer{margin-top:10px;padding-top:9px;border-top:1px solid var(--rule);
  font-family:var(--cond);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.slip-producer b{color:var(--ink2);font-weight:700}

/* cover mode */
.coverbox{margin-top:10px;padding:11px 14px;background:#F4F6F8;border-left:2px solid var(--rule-strong);font-size:13.5px;max-width:74ch}
.coverbox.auth-second{border-left-color:var(--med);background:var(--med-bg)}
.coverbox.auth-lead{border-left-color:var(--high);background:var(--high-bg)}
.coverwho{margin-top:7px;font-family:var(--mono);font-size:11.5px;color:var(--ink2)}

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">HR &amp; Payroll</div>
    <div class="tabs">
      <button class="tab on" data-view="dashboard">Overview</button>
      <button class="tab" data-view="employees">People</button>
      <button class="tab" data-view="group">Group</button>
      <button class="tab" data-view="payroll">Payroll</button>
      <button class="tab" data-view="leave">Leave</button>
      <button class="tab" data-view="absence">Absence</button>
      <button class="tab" data-view="payslips">Payslips</button>
      <button class="tab" data-view="pensions">Pensions</button>
      <button class="tab" data-view="automation">Automation</button>
      <button class="tab" data-view="journal">Journal</button>
      <button class="tab" data-view="integrations">Integrations</button>
      <button class="tab" data-view="settings">Settings</button>
    </div>
  </div>
</div>

<div class="wrap"><div id="app"></div></div>

<footer class="sitefoot">
  <div class="sitefoot-in">
    <span class="sf-brand">Powered by <b>Open Source AI Ltd</b></span>
    <span class="sf-note">Demonstration build · verify all statutory rates against HMRC before live use</span>
  </div>
</footer>

<div class="scrim" id="scrim">
  <div class="modal">
    <div class="modal-bar">
      <span class="eyebrow" id="modalLabel"></span>
      <div class="modal-acts" id="modalActions"></div>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
/* ============================================================================
   UK PAYROLL ENGINE — sector neutral
   ----------------------------------------------------------------------------
   Works for private companies, public bodies and charities. Nothing here
   assumes a particular employer type; everything that differs between them
   is configuration.

   Uses the HMRC "exact percentage method", permitted for computerised payroll.

   RATES ARE DEFAULTS AND ARE EDITABLE. Verify against HMRC before live use.
   ========================================================================== */

const p2       = n => Math.round((n + Number.EPSILON) * 100) / 100;
const floor2   = n => Math.floor((n + 1e-9) * 100) / 100;
const floorGBP = n => Math.floor(n + 1e-9);
const clamp    = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

/* ---------- pay frequency ------------------------------------------------- */
const PAY_FREQUENCIES = {
  weekly:      { label: "Weekly",       periods: 52 },
  fortnightly: { label: "Fortnightly",  periods: 26 },
  fourWeekly:  { label: "Four-weekly",  periods: 13 },
  monthly:     { label: "Monthly",      periods: 12 },
  quarterly:   { label: "Quarterly",    periods: 4  }
};

/* ---------- pension earnings bases ---------------------------------------
   The single biggest difference between a public-sector scheme and a private
   auto-enrolment scheme. Same percentage, very different money.
     qualifying  - band between lower and upper limits (AE minimum, NEST etc)
     pensionable - only elements marked pensionable (LGPS, TPS, many DB schemes)
     total       - every penny of gross (some generous DC schemes)
     basic       - basic salary only, ignoring overtime and allowances
------------------------------------------------------------------------- */
const PENSION_BASES = {

/* ============================================================================
   TAX CODES
   ========================================================================== */
function parseTaxCode(raw){
  const code = String(raw || "").toUpperCase().replace(/\s+/g,"");
  const out = { raw: code, cumulative: true, kind: "suffix", allowance: 0, fixedRate: null, valid: true, scottish: false, welsh: false };

  const nonCum = /(W1|M1|X)$/.test(code);
  let core = code.replace(/(W1|M1|X)$/,"");
  out.cumulative = !nonCum;

  if(core.startsWith("S")){ out.scottish = true; core = core.slice(1); }
  else if(core.startsWith("C")){ out.welsh = true; core = core.slice(1); }

  if(core === "NT"){ out.kind = "NT"; out.fixedRate = 0; return out; }
  if(core === "BR"){ out.kind = "BR"; out.fixedRate = 0.20; return out; }
  if(core === "D0"){ out.kind = "D0"; out.fixedRate = 0.40; return out; }
  if(core === "D1"){ out.kind = "D1"; out.fixedRate = 0.45; return out; }
  if(core === "D2"){ out.kind = "D2"; out.fixedRate = 0.48; return out; }

  const k = core.match(/^K(\d+)$/);
  if(k){ out.kind = "K"; out.allowance = -((parseInt(k[1],10) * 10) + 9); return out; }

  const s = core.match(/^(\d+)([LMNTY])$/);
  if(s){ out.allowance = (parseInt(s[1],10) * 10) + 9; return out; }

  out.valid = false;
  return out;
}

/* ============================================================================
   PAYE
   ========================================================================== */
function calcPAYE({ taxCode, taxablePayToDate, taxPaidToDate = 0, period, grossThisPeriod, config = DEFAULT_CONFIG }){
  const tc = parseTaxCode(taxCode);
  const n = periodsPerYear(config);
  const prop = tc.cumulative ? (period / n) : (1 / n);
  const bands = (tc.scottish || config.region === "scotland") ? config.scottishBands : config.bands;

  const payToDate = taxablePayToDate;
  const alreadyPaid = tc.cumulative ? taxPaidToDate : 0;

  if(tc.kind === "NT") return { tax: 0, taxDueToDate: 0, breakdown: [], code: tc, refund: false, regulatoryLimitApplied: false };

  let taxDueToDate = 0, breakdown = [];

  if(tc.fixedRate !== null){
    taxDueToDate = floor2(payToDate * tc.fixedRate);
    breakdown = [{ name: tc.kind + " — all pay", amount: p2(payToDate), rate: tc.fixedRate, tax: taxDueToDate }];
  } else {
    const freePay = floor2(tc.allowance * prop);
    let taxable = Math.max(payToDate - freePay, 0);
    let remaining = taxable, lower = 0, total = 0;
    for(const band of bands){
      const cap = band.limit === Infinity ? Infinity : floor2(band.limit * prop);
      const inBand = Math.min(remaining, cap - lower);
      if(inBand > 0){
        total += inBand * band.rate;
        breakdown.push({ name: band.name, amount: p2(inBand), rate: band.rate, tax: floor2(inBand * band.rate) });
        remaining -= inBand;
      }
      lower = cap;
      if(remaining <= 0) break;
    }
    taxDueToDate = floor2(total);
  }

  let tax = p2(taxDueToDate - alreadyPaid);
  const limit = floor2(grossThisPeriod * 0.5);
  let limited = false;
  if(tax > limit){ tax = limit; limited = true; }

  return { tax, taxDueToDate, breakdown, code: tc, refund: tax < 0, regulatoryLimitApplied: limited };
}

/* ============================================================================
   NATIONAL INSURANCE
   Directors are calculated on an ANNUAL cumulative basis, which is a genuine
   legal difference rather than a rounding preference.
   ========================================================================== */
function calcNI({ niablePay, category = "A", config = DEFAULT_CONFIG, director = false, niableToDate = 0, niEmployeePaidToDate = 0, niEmployerPaidToDate = 0 }){
  const n = periodsPerYear(config);
  const c = config.ni;
  const cat = String(category || "A").toUpperCase();

  const scale = director ? 1 : (1 / n);
  const LEL = floor2(c.lel * scale), PT = floor2(c.pt * scale), ST = floor2(c.st * scale);
  const UEL = floor2(c.uel * scale), UST = floor2(c.ust * scale), AUST = floor2(c.aust * scale);

  const pay = director ? p2(niableToDate + niablePay) : niablePay;

  const ptToUel = clamp(pay - PT, 0, UEL - PT);
  const aboveUel = Math.max(pay - UEL, 0);

  let employee = 0, employer = 0;
  if(cat === "X" || cat === "C") employee = 0;
  else if(cat === "B")           employee = ptToUel * c.employeeReduced + aboveUel * c.employeeUpper;
  else                           employee = ptToUel * c.employeeMain + aboveUel * c.employeeUpper;

  if(cat === "X")                       employer = 0;
  else if(cat === "M" || cat === "I")   employer = Math.max(pay - UST, 0) * c.employerRate;
  else if(cat === "H")                  employer = Math.max(pay - AUST, 0) * c.employerRate;
  else                                  employer = Math.max(pay - ST, 0) * c.employerRate;

  if(director){
    employee = p2(employee) - niEmployeePaidToDate;
    employer = p2(employer) - niEmployerPaidToDate;
  }

  return {
    employee: p2(employee), employer: p2(employer), category: cat, director,
    earningsAtLEL:    p2(clamp(niablePay, 0, floor2(c.lel / n))),
    earningsLELtoPT:  p2(clamp(niablePay - floor2(c.lel / n), 0, floor2(c.pt / n) - floor2(c.lel / n))),
    earningsPTtoUEL:  p2(clamp(niablePay - floor2(c.pt / n), 0, floor2(c.uel / n) - floor2(c.pt / n))),
    earningsAboveUEL: p2(Math.max(niablePay - floor2(c.uel / n), 0))
  };
}

/* ============================================================================
   STUDENT LOANS
   ========================================================================== */
function calcStudentLoan({ gross, plan, postgrad = false, config = DEFAULT_CONFIG }){
  const n = periodsPerYear(config);
  let main = 0, pgl = 0;
  if(plan && plan !== "none" && config.studentLoans[plan]){
    const p = config.studentLoans[plan];
    main = floorGBP(Math.max(gross - floor2(p.threshold / n), 0) * p.rate);
  }
  if(postgrad){
    const p = config.studentLoans.pgl;
    pgl = floorGBP(Math.max(gross - floor2(p.threshold / n), 0) * p.rate);
  }
  return { main, pgl, total: main + pgl };
}

/* ============================================================================
   PENSION — scheme driven
   ========================================================================== */
function pensionableEarnings({ gross, pensionablePortion, basicPortion, scheme, config = DEFAULT_CONFIG }){
  const n = periodsPerYear(config);
  switch(scheme.basis){
    case "qualifying": {
      const lo = floor2((scheme.qualifyingLower ?? config.autoEnrolment.qualifyingLower) / n);
      const hi = floor2((scheme.qualifyingUpper ?? config.autoEnrolment.qualifyingUpper) / n);
      return p2(clamp(gross - lo, 0, hi - lo));
    }
    case "pensionable": return p2(pensionablePortion);
    case "basic":       return p2(basicPortion);
    default:            return p2(gross);
  }
}

function calcPension({ gross, pensionablePortion, basicPortion, scheme, config = DEFAULT_CONFIG }){
  if(!scheme || (!scheme.employeeRate && !scheme.employerRate)){
    return { employee: 0, employer: 0, earnings: 0, method: "none", schemeName: "None",
             reducesTaxable: false, reducesNIable: false, basis: null };
  }
  const earnings = pensionableEarnings({ gross, pensionablePortion, basicPortion, scheme, config });
  return {
    employee: p2(earnings * (scheme.employeeRate || 0)),
    employer: p2(earnings * (scheme.employerRate || 0)),
    earnings, method: scheme.method, basis: scheme.basis, schemeName: scheme.name,
    reducesTaxable: scheme.method === "netPay" || scheme.method === "salarySac",
    reducesNIable:  scheme.method === "salarySac"
  };
}

/* ============================================================================
   STATUTORY PAYMENTS  (helpers that generate pay elements)
   ========================================================================== */
function calcSSP({ sickDays, qualifyingDaysPerWeek = 5, waitingDaysAlreadyServed = 0, config = DEFAULT_CONFIG }){
  const s = config.statutory;
  const waiting = Math.max(0, Math.min(s.sspWaitingDays - waitingDaysAlreadyServed, sickDays));
  const payable = Math.max(0, sickDays - waiting);
  const daily = s.sspWeekly / qualifyingDaysPerWeek;
  return { waitingDays: waiting, payableDays: payable, dailyRate: p2(daily), amount: p2(payable * daily) };
}

function calcSMP({ weekNumber, averageWeeklyEarnings, config = DEFAULT_CONFIG }){
  const s = config.statutory;
  if(weekNumber < 1 || weekNumber > s.smpHigherWeeks + s.smpStandardWeeks) return { weekly: 0, stage: "outside" };
  if(weekNumber <= s.smpHigherWeeks){
    return { weekly: p2(averageWeeklyEarnings * s.smpHigherPct), stage: "higher" };
  }
  return { weekly: p2(Math.min(averageWeeklyEarnings * s.smpHigherPct, s.smpStandardWeekly)), stage: "standard" };
}

/* ============================================================================
   FULL PAYSLIP
   ========================================================================== */
function periodsPerYear(config){
  return (PAY_FREQUENCIES[config.payFrequency] || PAY_FREQUENCIES.monthly).periods;
}

function calcPayslip({ employee, period, elements = [], ytd = null, scheme = null, config = DEFAULT_CONFIG }){
  const e = employee;
  const n = periodsPerYear(config);
  const y = ytd || { gross:0, taxable:0, niable:0, tax:0, niEmployee:0, niEmployer:0, pension:0, pensionEr:0, studentLoan:0, net:0 };

  const basic = p2((e.annualSalary || 0) / n);
  const payments = [];
  if(basic > 0) payments.push({ label: "Basic pay", amount: basic, pensionable: true, niable: true, taxable: true, basic: true });

  for(const el of elements){
    payments.push({
      label: el.label, amount: p2(el.amount), hours: el.hours || null, rate: el.rate || null,
      pensionable: el.pensionable !== false, niable: el.niable !== false, taxable: el.taxable !== false, basic: false
    });
  }

  const gross       = p2(payments.reduce((s,x) => s + x.amount, 0));
  const pensionable = p2(payments.filter(x => x.pensionable).reduce((s,x) => s + x.amount, 0));
  const basicOnly   = p2(payments.filter(x => x.basic).reduce((s,x) => s + x.amount, 0));

  const pen = calcPension({ gross, pensionablePortion: pensionable, basicPortion: basicOnly, scheme, config });

  const taxableThis = p2(gross - (pen.reducesTaxable ? pen.employee : 0));
  const niableThis  = p2(gross - (pen.reducesNIable  ? pen.employee : 0));

  const paye = calcPAYE({
    taxCode: e.taxCode, taxablePayToDate: p2(y.taxable + taxableThis),
    taxPaidToDate: y.tax, period, grossThisPeriod: gross, config
  });

  const ni = calcNI({
    niablePay: niableThis, category: e.niCategory, config,
    director: !!e.director, niableToDate: y.niable,
    niEmployeePaidToDate: y.niEmployee, niEmployerPaidToDate: y.niEmployer
  });

  const sl = calcStudentLoan({ gross: niableThis, plan: e.studentLoanPlan, postgrad: !!e.postgradLoan, config });

  const deductions = [];
  if(paye.tax !== 0)   deductions.push({ label: paye.tax < 0 ? "PAYE income tax (refund)" : "PAYE income tax", amount: paye.tax, statutory: true });
  if(ni.employee > 0)  deductions.push({ label: `National Insurance — cat ${ni.category}${ni.director ? " (director)" : ""}`, amount: ni.employee, statutory: true });
  if(pen.employee > 0) deductions.push({ label: `${pen.schemeName} — ${((scheme?.employeeRate||0)*100).toFixed(1)}%`, amount: pen.employee, statutory: false });
  if(sl.main > 0)      deductions.push({ label: `Student loan — ${String(e.studentLoanPlan||"").replace("plan","Plan ")}`, amount: sl.main, statutory: true });
  if(sl.pgl > 0)       deductions.push({ label: "Postgraduate loan", amount: sl.pgl, statutory: true });
  for(const o of (e.otherDeductions || [])) if(o.amount > 0) deductions.push({ label: o.label, amount: p2(o.amount), statutory: false });

  const totalDeductions = p2(deductions.reduce((s,d) => s + d.amount, 0));
  const net = p2(gross - totalDeductions);

  return {
    period, employeeId: e.id, payments, deductions,
    gross, pensionable, taxableThis, niableThis,
    pension: pen, ni, paye, studentLoan: sl,
    totalDeductions, net,
    employerCost: p2(gross + ni.employer + pen.employer),
    ytd: {
      gross: p2(y.gross + gross), taxable: p2(y.taxable + taxableThis), niable: p2(y.niable + niableThis),
      tax: p2(y.tax + paye.tax), niEmployee: p2(y.niEmployee + ni.employee), niEmployer: p2(y.niEmployer + ni.employer),
      pension: p2(y.pension + pen.employee), pensionEr: p2(y.pensionEr + pen.employer),
      studentLoan: p2(y.studentLoan + sl.total), net: p2(y.net + net)
    }
  };
}

/* ============================================================================
   EMPLOYER RELIEFS — applied at run level, not per employee
   ========================================================================== */
function applyEmployerReliefs({ totalEmployerNI, allowanceUsedToDate = 0, org, config = DEFAULT_CONFIG }){
  const r = config.employerReliefs;
  let allowanceClaimed = 0;
  if(org.claimsEmploymentAllowance){
    const remaining = Math.max(0, r.employmentAllowance - allowanceUsedToDate);
    allowanceClaimed = p2(Math.min(remaining, totalEmployerNI));
  }
  return {
    employerNIGross: p2(totalEmployerNI),
    employmentAllowanceClaimed: allowanceClaimed,
    employerNIPayable: p2(totalEmployerNI - allowanceClaimed),
    allowanceRemaining: p2(Math.max(0, r.employmentAllowance - allowanceUsedToDate - allowanceClaimed))
  };
}

/* ============================================================================
   EXCEPTIONS
   ========================================================================== */
function detectExceptions({ payslips, employees, priorPayslips = {}, period, schemes = [], config = DEFAULT_CONFIG }){
  const out = [];
  const byId = Object.fromEntries(employees.map(e => [e.id, e]));
  let n = 0;
  const ref = () => "E-" + String(++n).padStart(2,"0");

  const banks = {};
  employees.filter(e => e.status === "active" && e.bankAccount).forEach(e => {
    const k = (e.bankSort||"") + "|" + e.bankAccount;
    (banks[k] = banks[k] || []).push(e);
  });
  Object.values(banks).filter(g => g.length > 1).forEach(g => out.push({
    ref: ref(), severity: "high", kind: "model",
    title: "Two or more employees share the same bank account",
    subject: g.map(e => e.name).join(" / "), employeeIds: g.map(e => e.id),
    amount: p2(g.reduce((s,e) => s + (payslips.find(p => p.employeeId === e.id)?.net || 0), 0)),
    why: "These records pay to an identical sort code and account number. Often legitimate — a joint account held by two employed family members — but it is also the clearest signature of a duplicate record or a diverted payment.",
    evidence: g.map(e => [e.name, (e.bankSort||"??-??-??") + " / ····" + String(e.bankAccount).slice(-4)]),
    action: "Confirm the individuals are distinct before release. Differing NI numbers support that they are."
  }));

  employees.forEach(e => {
    if(!e.leavingDate) return;
    const ps = payslips.find(p => p.employeeId === e.id);
    if(ps && new Date(e.leavingDate) < new Date(period.start)) out.push({
      ref: ref(), severity: "high", kind: "rule",
      title: "Leaver is still active in the run",
      subject: e.name + " · " + e.payrollNumber, employeeIds: [e.id], amount: ps.net,
      why: `A leaving date of ${e.leavingDate} precedes the start of this pay period, but a full payment is scheduled.`,
      evidence: [["Leaving date", e.leavingDate],["Period start", period.start],["Scheduled net", "£" + ps.net.toFixed(2)]],
      action: "Hold from the run and process as a leaver with a P45. Releasing creates an overpayment recoverable only by agreement."
    });
  });

  payslips.forEach(ps => {
    const prior = priorPayslips[ps.employeeId];
    if(!prior || prior.net <= 0) return;
    const delta = (ps.net - prior.net) / prior.net;
    if(Math.abs(delta) >= 0.30) out.push({
      ref: ref(), severity: Math.abs(delta) >= 0.60 ? "high" : "med", kind: "model",
      title: `Net pay ${delta > 0 ? "up" : "down"} ${Math.abs(delta*100).toFixed(0)}% against last period`,
      subject: byId[ps.employeeId]?.name || ps.employeeId, employeeIds: [ps.employeeId],
      amount: p2(Math.abs(ps.net - prior.net)),
      why: "A change of this size is usually a known event — overtime, changed hours, a backdated award. It is also how double payments and keying errors present.",
      evidence: [["Last period","£"+prior.net.toFixed(2)],["This period","£"+ps.net.toFixed(2)],["Change","£"+(ps.net-prior.net).toFixed(2)]],
      action: "Confirm the cause before release."
    });
  });

  payslips.forEach(ps => {
    const e = byId[ps.employeeId];
    if(!e || !e.dob) return;
    const age = ageAt(e.dob, period.end);
    if(e.niCategory === "C" && age < 66) out.push({
      ref: ref(), severity: "med", kind: "rule",
      title: "NI category C applied below State Pension age",
      subject: e.name, employeeIds: [e.id], amount: 0,
      why: "Category C applies only above State Pension age. Either the category or the date of birth is wrong.",
      evidence: [["NI category","C"],["Date of birth",e.dob],["Age at period end",String(age)]],
      action: "Verify the date of birth first — correcting the category against a wrong DOB compounds the error."
    });
    if(e.niCategory === "M" && age >= 21) out.push({
      ref: ref(), severity: "med", kind: "rule",
      title: "NI category M applied to an employee aged 21 or over",
      subject: e.name, employeeIds: [e.id], amount: 0,
      why: "Category M is for employees under 21. Secondary NI is being under-paid.",
      evidence: [["NI category","M"],["Age at period end",String(age)]],
      action: "Move to category A from the period following the 21st birthday."
    });
    if(e.niCategory === "H" && age >= 25) out.push({
      ref: ref(), severity: "med", kind: "rule",
      title: "Apprentice NI category H applied to an employee aged 25 or over",
      subject: e.name, employeeIds: [e.id], amount: 0,
      why: "Category H applies to apprentices under 25 on an approved scheme.",
      evidence: [["NI category","H"],["Age at period end",String(age)]],
      action: "Move to the appropriate standard category."
    });
  });

  payslips.forEach(ps => {
    const e = byId[ps.employeeId];
    if(!e) return;
    const annualised = ps.gross * periodsPerYear(config);
    const scheme = schemes.find(s => s.id === e.pensionSchemeId);
    const contributing = scheme && (scheme.employeeRate > 0 || scheme.employerRate > 0);
    if(annualised >= config.autoEnrolment.triggerAnnual && !contributing && !e.pensionOptOut) out.push({
      ref: ref(), severity: "med", kind: "rule",
      title: "Eligible jobholder with no pension scheme and no opt-out",
      subject: e.name, employeeIds: [e.id], amount: 0,
      why: "Earnings exceed the auto-enrolment trigger but no contributing scheme is assigned and no opt-out is recorded.",
      evidence: [["Annualised earnings","£"+annualised.toFixed(0)],["Trigger","£"+config.autoEnrolment.triggerAnnual],["Scheme",scheme ? scheme.name : "none"],["Opt-out","none"]],
      action: "Enrol and backdate, or record a valid opt-out. This is a Pensions Regulator matter, not a payroll error."
    });
  });

  payslips.filter(ps => ps.net < 0).forEach(ps => out.push({
    ref: ref(), severity: "high", kind: "rule",
    title: "Negative net pay",
    subject: byId[ps.employeeId]?.name || ps.employeeId, employeeIds: [ps.employeeId], amount: p2(Math.abs(ps.net)),
    why: "Deductions exceed gross pay. This cannot be paid and will fail at BACS.",
    evidence: [["Gross","£"+ps.gross.toFixed(2)],["Deductions","£"+ps.totalDeductions.toFixed(2)],["Net","£"+ps.net.toFixed(2)]],
    action: "Reduce or defer a voluntary deduction. Statutory deductions cannot take pay below zero."
  }));

  payslips.forEach(ps => {
    const e = byId[ps.employeeId];
    if(!e) return;
    const tc = parseTaxCode(e.taxCode);
    if(!tc.valid) out.push({
      ref: ref(), severity: "med", kind: "rule",
      title: "Tax code is missing or not recognised",
      subject: e.name, employeeIds: [e.id], amount: 0,
      why: "Without a valid code the record defaults to an emergency basis and the employee is over-taxed.",
      evidence: [["Code held", e.taxCode || "(none)"]],
      action: "Capture a starter declaration, or apply the code from the P45 or HMRC notice."
    });
    else if(!tc.cumulative) out.push({
      ref: ref(), severity: "low", kind: "rule",
      title: "Employee is on a non-cumulative (emergency) tax code",
      subject: e.name, employeeIds: [e.id], amount: 0,
      why: "Tax is calculated on this period alone, ignoring earlier pay. This usually over-deducts until HMRC issues a cumulative code.",
      evidence: [["Code held", e.taxCode],["Basis","Week 1 / Month 1"]],
      action: "Monitor for a P6 from HMRC. No action needed if the starter declaration was recent."
    });
    if(!e.niNumber) out.push({
      ref: ref(), severity: "low", kind: "rule",
      title: "No National Insurance number held",
      subject: e.name, employeeIds: [e.id], amount: 0,
      why: "The FPS will be accepted but HMRC may be unable to match the record, which can misallocate contributions.",
      evidence: [["NI number","(none)"]],
      action: "Obtain the number, or record that the employee has applied for one."
    });
  });

  const order = { high: 0, med: 1, low: 2 };
  return out.sort((a,b) => order[a.severity] - order[b.severity] || b.amount - a.amount);
}

function ageAt(dob, on){
  const d = new Date(dob), o = new Date(on);
  let a = o.getFullYear() - d.getFullYear();
  const m = o.getMonth() - d.getMonth();
  if(m < 0 || (m === 0 && o.getDate() < d.getDate())) a--;
  return a;
}

/* ============================================================================
   LEAVE
   ========================================================================== */
const BANK_HOLIDAYS = {
  "2026-04-03":"Good Friday","2026-04-06":"Easter Monday","2026-05-04":"Early May",
  "2026-05-25":"Spring","2026-08-31":"Summer","2026-12-25":"Christmas Day",
  "2026-12-28":"Boxing Day (substitute)","2027-01-01":"New Year's Day"
};

function workingDaysBetween(from, to, opts = {}){
  const skipBH = opts.skipBankHolidays !== false;
  const a = new Date(from + "T00:00:00"), b = new Date(to + "T00:00:00");
  if(isNaN(a) || isNaN(b) || b < a) return null;
  let working = 0, weekend = 0, bank = 0;
  for(let d = new Date(a); d <= b; d.setDate(d.getDate() + 1)){
    const iso = d.toISOString().slice(0,10), dow = d.getDay();
    if(dow === 0 || dow === 6){ weekend++; continue; }
    if(skipBH && BANK_HOLIDAYS[iso]){ bank++; continue; }
    working++;
  }
  return { working, weekend, bank };
}

function leaveHours(from, to, halfMode, hoursPerDay){
  const w = workingDaysBetween(from, to);
  if(!w) return null;
  let d = w.working;
  if(d > 0){
    if(halfMode === "start" || halfMode === "end") d -= 0.5;
    if(halfMode === "both") d -= (d > 1 ? 1 : 0.5);
  }
  return { ...w, days: d, hours: p2(d * hoursPerDay) };
}

/* Statutory minimum is 5.6 weeks, capped at 28 days for a 5-day week.
   Anything above that is contractual. */
function statutoryMinimumDays(daysPerWeek){
  return Math.min(p2((daysPerWeek || 5) * 5.6), 28);
}

function leaveBalance(employee, records, asAt){
  const hpd = (employee.weeklyHours || 37.5) / (employee.daysPerWeek || 5);
  const statMin = statutoryMinimumDays(employee.daysPerWeek);
  const entDays = employee.leaveDays ?? statMin;
  const inclusive = employee.bankHolidaysInEntitlement !== false;

  const entitlementHours = p2(entDays * hpd);
  const bankHours = inclusive ? 0 : p2((employee.bankHolidayDays ?? 8) * hpd);
  const carriedHours = p2((employee.carriedDays || 0) * hpd);
  const total = p2(entitlementHours + bankHours + carriedHours);

  const mine = records.filter(r => r.employeeId === employee.id && r.status !== "rejected" && r.status !== "cancelled");
  const now = new Date(asAt + "T00:00:00");
  let taken = 0, booked = 0, pending = 0, carriedUsed = 0;
  mine.forEach(r => {
    if(r.type === "unpaid" || r.type === "sick") return;
    if(r.type === "carried") carriedUsed += r.hours;
    if(r.status === "pending"){ pending += r.hours; return; }
    (new Date(r.to + "T00:00:00") < now ? (taken += r.hours) : (booked += r.hours));
  });

  return {
    hoursPerDay: hpd, total, entitlementHours, bankHours, carriedHours,
    statutoryMinimumDays: statMin,
    belowStatutory: entDays + (inclusive ? 0 : (employee.bankHolidayDays ?? 8)) < statMin,
    taken: p2(taken), booked: p2(booked), pending: p2(pending),
    available: p2(total - taken - booked - pending),
    carriedRemaining: p2(Math.max(0, carriedHours - carriedUsed)),
    days: h => p2(h / hpd)
  };
}

var ENGINE = { DEFAULT_CONFIG, PAY_FREQUENCIES, PENSION_BASES, PENSION_METHODS,
  parseTaxCode, calcPAYE, calcNI, calcStudentLoan, calcPension, pensionableEarnings,
  calcSSP, calcSMP, calcPayslip, applyEmployerReliefs, detectExceptions,
  workingDaysBetween, leaveHours, leaveBalance, statutoryMinimumDays,
  BANK_HOLIDAYS, ageAt, p2, periodsPerYear };

/* ============================================================================
   AUTOMATION POLICY ENGINE
   ----------------------------------------------------------------------------
   Automates the PATH, never the DECISION. Some things are permanently
   un-automatable no matter what mode the organisation selects:
     - committing a run (BACS is effectively irrevocable)
     - releasing a payment to someone flagged as a leaver
     - anything that reduces an individual's pay without notice
     - duplicate bank accounts and negative net pay
   Those carry never:true and cannot be raised above "propose" from the UI.
   ========================================================================== */

var TIERS = {
  off:     { label: "Off",              rank: 0, note: "Not evaluated" },
  propose: { label: "Propose",          rank: 1, note: "Prepares the change, a person clicks to accept" },
  notify:  { label: "Apply and notify", rank: 2, note: "Applies it, records it, reversible from the log" },
  apply:   { label: "Apply",            rank: 3, note: "Applies it silently, still recorded in the log" }
};

var MODES = {
  manual:    { label: "Manual",    note: "Nothing happens without a person doing it. Every check is a human check." },
  assisted:  { label: "Assisted",  note: "The system prepares every fix but waits for a click. Nothing changes on its own." },
  automated: { label: "Automated", note: "Routine corrections apply themselves and are logged. Judgement calls still stop." },
  cover:     { label: "Cover",     note: "For when the payroll lead is away. Routine work handles itself, every remaining decision comes with plain-English guidance, and anything above the delegation limit needs a second name." }
};

var AUTOMATION_RULES = [
  { id:"ni-age", name:"National Insurance category by age", group:"Statutory",
    what:"Moves category M to A at 21, H to A at 25, and to C at State Pension age.",
    why:"Age thresholds are arithmetic, not judgement. Leaving M on a 22-year-old under-pays employer NI every period until someone notices.",
    autoTier:"apply", never:false },

  { id:"auto-enrolment", name:"Auto-enrolment assessment", group:"Pensions",
    what:"Enrols an eligible jobholder into the default scheme when earnings pass the trigger and no opt-out is held.",
    why:"The Pensions Regulator expects assessment every pay period. Doing it by hand is where employers fall behind.",
    autoTier:"notify", never:false },

  { id:"recurring-elements", name:"Recurring pay elements", group:"Payroll",
    what:"Carries forward pay elements marked as recurring from the last committed run.",
    why:"Re-keying the same allowance every period is pure waste and a common source of omission.",
    autoTier:"apply", never:false },

  { id:"bank-format", name:"Bank detail validation", group:"Payments",
    what:"Checks sort code and account number structure before a payment file is produced.",
    why:"Catching a malformed account before BACS is far cheaper than a failed payment and a chased correction.",
    autoTier:"notify", never:false },

  { id:"carryover-expiry", name:"Carry-over expiry warning", group:"Leave",
    what:"Notifies employees whose carried-over leave is close to expiring.",
    why:"Carried leave cannot be paid in lieu. Silence means the employee simply loses it.",
    autoTier:"notify", never:false },

  { id:"clear-informational", name:"Clear informational exceptions", group:"Payroll",
    what:"Auto-releases low-severity exceptions that carry no financial impact, with the rule recorded as the decider.",
    why:"A missing NI number should not block a payroll run. It should be chased, not gate the money.",
    autoTier:"notify", never:false },

  { id:"tax-code", name:"Apply HMRC tax code notices", group:"Statutory",
    what:"Applies P6 and P9 coding notices received from HMRC.",
    why:"HMRC notices are authoritative and involve no judgement. Keying them by hand wastes time and introduces error.",
    autoTier:"propose", never:true,
    blocked:"Requires the HMRC Data Provisioning Service, which needs RTI recognition first. Until then this can only propose from what is already on file." },

  { id:"leaver-final-pay", name:"Leaver final pay", group:"Payroll",
    what:"Prepares the final payslip: holds the record, calculates payment in lieu of untaken leave, and readies the P45.",
    why:"Highest error rate in payroll, and an overpayment to someone who has left is the hardest of all to recover.",
    autoTier:"propose", never:true,
    blocked:"A person confirms every leaver. This is where the costliest payroll errors happen." },

  { id:"commit-run", name:"Commit the payroll run", group:"Payments",
    what:"Releases the run for payment.",
    why:"BACS is effectively irrevocable. Recovering an overpayment from a low-paid worker is a union and reputational problem before it is a finance one.",
    autoTier:"off", never:true,
    blocked:"Permanently manual. A named person takes responsibility before money moves." }
];

/* ============================================================================
   COVER MODE
   ----------------------------------------------------------------------------
   The payroll lead is off. Someone competent but less experienced has to get
   the run out. This is not "the system does it alone" — it is a first officer
   arrangement: the aircraft flies itself more of the time, every remaining
   decision is explained rather than merely flagged, and there is a hard limit
   on what one person can sign off without a second name.

   The limits mirror controls an auditor already expects: delegated authority,
   dual authorisation above a threshold, and a handover record.
   ========================================================================== */
var DEFAULT_COVER = {
  active: false,
  leadName: "",              // who is away
  deputyName: "",            // who is covering
  releaseLimit: 1000,        // £ a deputy may release alone
  requireSecondApproval: true,
  escalateHighSeverity: true,
  returnsOn: null
};

/* Plain-English guidance per rule, written for someone who does not run
   payroll every month. Deliberately says what the risk is, not just what the
   rule found. */
var COVER_GUIDANCE = {
  "leaver-final-pay":
    "Someone has left but is still being paid. If you release this, the money goes and getting it back means asking them to return it. Hold it unless you know for certain they are still employed.",
  "bank-format":
    "These bank details will be rejected by the bank. The payment will fail and the employee will not be paid on time. Fix the details or hold that one record.",
  "ni-age":
    "A birthday changed which National Insurance category applies. This is arithmetic, not judgement — accepting it is safe.",
  "auto-enrolment":
    "Their earnings mean they must be offered a pension. Accepting enrols them, which is what the law requires. If they have opted out, the opt-out form needs recording first.",
  "recurring-elements":
    "The same allowances as last month, carried forward. Check the amounts look like last month's payslip and accept.",
  "carryover-expiry":
    "Nothing to fix in this run. It is a warning to the employee that leave will be lost.",
  "clear-informational":
    "Paperwork rather than money. Safe to clear now and chase afterwards.",
  "tax-code":
    "No valid tax code held, so the emergency code applies. The employee may be over-taxed for a month and HMRC will correct it later. Accepting is the normal course."
};

function coverAssessment(action, exceptionAmount, cover){
  const amount = Number(exceptionAmount || 0);
  const rule = AUTOMATION_RULES.find(r => r.id === action.ruleId) || {};
  const overLimit = amount > (cover.releaseLimit || 0);
  const highSeverity = action.blocking === true;

  let authority = "deputy";
  let reason = "Within the delegated limit.";

  if(highSeverity && cover.escalateHighSeverity){
    authority = "lead";
    reason = "High-risk item. Held for " + (cover.leadName || "the payroll lead") + " to decide on their return.";
  } else if(overLimit && cover.requireSecondApproval){
    authority = "second";
    reason = "£" + amount.toFixed(2) + " is above the £" + Number(cover.releaseLimit).toFixed(2)
           + " delegated limit, so it needs a second named approver.";
  }

  return {
    authority, reason,
    guidance: COVER_GUIDANCE[action.ruleId] || "Check the evidence and decide. If you are unsure, hold it — a held record can be paid later, a wrong payment cannot be unpaid.",
    amount
  };
}

/* A run cannot be committed under cover authority while anything is escalated. */
function coverReadiness({ exceptions, decisions, actions, cover }){
  const open = (exceptions || []).filter(x => !decisions?.[x.ref]);
  const escalated = (actions || [])
    .map(a => ({ a, c: coverAssessment(a, a.amount || 0, cover) }))
    .filter(x => x.c.authority !== "deputy");

  return {
    open: open.length,
    escalated: escalated.length,
    needsSecondApproval: escalated.filter(x => x.c.authority === "second").length,
    heldForLead: escalated.filter(x => x.c.authority === "lead").length,
    canCommit: open.length === 0 && escalated.filter(x => x.c.authority === "lead").length === 0
  };
}

function defaultPolicy(mode){
  const p = {};
  AUTOMATION_RULES.forEach(r => {
    if(mode === "manual")        p[r.id] = "off";
    else if(mode === "assisted") p[r.id] = r.id === "commit-run" ? "off" : "propose";
    else if(mode === "cover")    p[r.id] = r.never ? (r.id === "commit-run" ? "off" : "propose") : r.autoTier;
    else                          p[r.id] = r.never ? (r.id === "commit-run" ? "off" : "propose") : r.autoTier;
  });
  return p;
}

function tierFor(policy, ruleId){
  const rule = AUTOMATION_RULES.find(r => r.id === ruleId);
  let t = policy?.[ruleId] || "off";
  if(rule?.never && TIERS[t].rank > TIERS.propose.rank) t = "propose";
  if(rule?.id === "commit-run") t = "off";
  return t;
}

/* ---------- bank detail validation ---------------------------------------
   Structural validation only. Full VocaLink modulus checking needs their
   published weights table (EISCD), which is licensed and not embedded here.
   Structure alone still removes most keying errors.
------------------------------------------------------------------------- */
function validateBankDetails(sort, account){
  const s = String(sort || "").replace(/\D/g,"");
  const a = String(account || "").replace(/\D/g,"");
  const problems = [];
  if(!s) problems.push("no sort code");
  else if(s.length !== 6) problems.push("sort code is " + s.length + " digits, expected 6");
  else if(/^0{6}$/.test(s)) problems.push("sort code is all zeros");
  if(!a) problems.push("no account number");
  else if(a.length < 6 || a.length > 10) problems.push("account number is " + a.length + " digits, expected 6 to 10");
  else if(/^0+$/.test(a)) problems.push("account number is all zeros");
  return { valid: problems.length === 0, problems, sort: s, account: a,
           modulusChecked: false };
}

/* ============================================================================
   EVALUATION — returns proposed actions, applies nothing itself
   ========================================================================== */
function evaluateAutomations({ employees, payslips, exceptions, schemes, leave, period, policy, config, lastRun }){
  const actions = [];
  const byId = Object.fromEntries(employees.map(e => [e.id, e]));
  let seq = 0;
  const mk = (ruleId, o) => {
    const tier = tierFor(policy, ruleId);
    if(tier === "off") return;
    actions.push({ id: "A" + (++seq), ruleId, tier, ...o });
  };

  /* --- NI category by age --- */
  employees.filter(e => e.status === "active" && e.dob).forEach(e => {
    const age = ageAt(e.dob, period.end);
    let to = null;
    if(e.niCategory === "M" && age >= 21) to = "A";
    else if(e.niCategory === "H" && age >= 25) to = "A";
    else if(["A","B","H","M"].includes(e.niCategory) && age >= 66) to = "C";
    if(to) mk("ni-age", {
      scope:"employee", targetId:e.id,
      label:`${e.name}: NI category ${e.niCategory} to ${to}`,
      detail:`Aged ${age} at the end of this period.`,
      evidence:[["Current category", e.niCategory],["Age at period end", String(age)],["Correct category", to]],
      change:{ type:"setField", employeeId:e.id, field:"niCategory", from:e.niCategory, to }
    });
  });

  /* --- auto-enrolment --- */
  const dflt = schemes.find(s => s.isDefault) || schemes[0];
  if(dflt) payslips.forEach(ps => {
    const e = byId[ps.employeeId];
    if(!e || e.pensionOptOut) return;
    const inScheme = schemes.some(s => s.id === e.pensionSchemeId);
    const annualised = ps.gross * periodsPerYear(config);
    if(!inScheme && annualised >= config.autoEnrolment.triggerAnnual) mk("auto-enrolment", {
      scope:"employee", targetId:e.id,
      label:`${e.name}: enrol into ${dflt.name}`,
      detail:`Annualised earnings of £${annualised.toFixed(0)} exceed the £${config.autoEnrolment.triggerAnnual} trigger.`,
      evidence:[["Annualised earnings","£"+annualised.toFixed(0)],["Trigger","£"+config.autoEnrolment.triggerAnnual],["Scheme",dflt.name],["Opt-out","none held"]],
      change:{ type:"setField", employeeId:e.id, field:"pensionSchemeId", from:e.pensionSchemeId||"", to:dflt.id }
    });
  });

  /* --- recurring pay elements --- */
  if(lastRun) Object.entries(lastRun.elements || {}).forEach(([empId, els]) => {
    const recurring = els.filter(x => x.recurring);
    if(!recurring.length || !byId[empId] || byId[empId].status !== "active") return;
    mk("recurring-elements", {
      scope:"element", targetId:empId,
      label:`${byId[empId].name}: carry forward ${recurring.length} recurring element${recurring.length>1?"s":""}`,
      detail:recurring.map(x => x.label + " £" + x.amount.toFixed(2)).join(", "),
      evidence:recurring.map(x => [x.label, "£" + x.amount.toFixed(2)]),
      change:{ type:"addElements", employeeId:empId, elements:recurring }
    });
  });

  /* --- bank detail validation --- */
  employees.filter(e => e.status === "active").forEach(e => {
    const v = validateBankDetails(e.bankSort, e.bankAccount);
    if(!v.valid) mk("bank-format", {
      scope:"employee", targetId:e.id, blocking:true,
      label:`${e.name}: bank details will fail`,
      detail:v.problems.join("; ") + ".",
      evidence:[["Sort code", e.bankSort || "(none)"],["Account", e.bankAccount || "(none)"],["Problems", v.problems.join("; ")]],
      change:{ type:"flagOnly", employeeId:e.id }
    });
  });

  /* --- carry-over expiry --- */
  employees.filter(e => e.status === "active" && e.carriedDays > 0).forEach(e => {
    const bal = leaveBalance(e, leave, period.end);
    if(bal.carriedRemaining > 0) mk("carryover-expiry", {
      scope:"employee", targetId:e.id,
      label:`${e.name}: ${bal.days(bal.carriedRemaining).toFixed(1)} days of carried leave will expire`,
      detail:"Carried leave cannot be paid in lieu. Unused, it is simply lost.",
      evidence:[["Carried remaining", bal.carriedRemaining.toFixed(1) + " hrs"],["In days", bal.days(bal.carriedRemaining).toFixed(1)]],
      change:{ type:"notifyOnly", employeeId:e.id, message:"You have carried-over leave close to expiry." }
    });
  });

  /* --- clear informational exceptions --- */
  const INFORMATIONAL = ["No National Insurance number held","Employee is on a non-cumulative (emergency) tax code"];
  (exceptions || []).filter(x => x.severity === "low" && x.amount === 0 && INFORMATIONAL.some(t => x.title.startsWith(t)))
    .forEach(x => mk("clear-informational", {
      scope:"exception", targetId:x.ref,
      label:`${x.ref} cleared: ${x.title.toLowerCase()}`,
      detail:"No financial impact. Released so it does not gate the run, and raised as a task instead.",
      evidence:x.evidence,
      change:{ type:"decideException", ref:x.ref, decision:"release" }
    }));

  /* --- leaver final pay (propose only, always) --- */
  employees.filter(e => e.leavingDate).forEach(e => {
    const ps = payslips.find(p => p.employeeId === e.id);
    if(!ps || new Date(e.leavingDate) >= new Date(period.start)) return;
    const bal = leaveBalance(e, leave, period.end);
    const hourly = (e.annualSalary || 0) / 52.143 / (e.weeklyHours || 37.5);
    mk("leaver-final-pay", {
      scope:"employee", targetId:e.id, blocking:true,
      label:`${e.name}: prepare final pay`,
      detail:`Left ${e.leavingDate}. ${bal.available.toFixed(1)} hours untaken, worth £${(bal.available*hourly).toFixed(2)} in lieu.`,
      evidence:[["Leaving date", e.leavingDate],["Untaken leave", bal.available.toFixed(1) + " hrs"],
                ["Payment in lieu", "£" + (bal.available*hourly).toFixed(2)],["Scheduled net", "£" + ps.net.toFixed(2)]],
      change:{ type:"markLeaver", employeeId:e.id, pilonHours:bal.available, pilonAmount:p2(bal.available*hourly) }
    });
  });

  /* --- tax codes (propose only until DPS is connected) --- */
  employees.filter(e => e.status === "active" && !parseTaxCode(e.taxCode).valid).forEach(e => {
    mk("tax-code", {
      scope:"employee", targetId:e.id,
      label:`${e.name}: apply emergency tax code`,
      detail:"No valid code held. The statutory emergency code applies until HMRC issues one.",
      evidence:[["Code held", e.taxCode || "(none)"],["Proposed", "1257L W1/M1"]],
      change:{ type:"setField", employeeId:e.id, field:"taxCode", from:e.taxCode||"", to:"1257LM1" }
    });
  });

  return actions;
}

/* ---------- touchless rate ------------------------------------------------ */
function touchlessRate({ payslips, exceptions, decisions, actions }){
  if(!payslips.length) return { rate: 0, touched: 0, total: 0 };
  const touched = new Set();
  (exceptions || []).forEach(x => {
    const d = decisions?.[x.ref];
    const auto = d && d.byRule;
    if(!auto) (x.employeeIds || []).forEach(id => touched.add(id));
  });
  (actions || []).filter(a => a.tier === "propose").forEach(a => { if(a.targetId) touched.add(a.targetId); });
  const total = payslips.length;
  return { rate: Math.round(((total - touched.size) / total) * 1000) / 10, touched: touched.size, total };
}


/* ============================================================================
   PAYROLL JOURNAL ENGINE
   ----------------------------------------------------------------------------
   Turns a committed payroll run into double-entry accounting lines.

   The shape of it, in plain terms:

     DEBIT  what employing people COST the organisation this period
              gross pay, employer NI, employer pension, and any accrual
     CREDIT what the organisation now OWES as a result
              PAYE and NI to HMRC, contributions to the pension provider,
              net pay to the employees, deductions to third parties

   Debits must equal credits exactly. A journal that does not balance is not a
   rounding nuisance — every accounting system will reject it outright, so the
   balance check here is a hard error rather than a warning.

   Deliberately format-neutral. The same journal posts to Xero, to Sage, or to
   a CSV a bookkeeper types in by hand. Only the delivery differs.
   ========================================================================== */

var jp2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

/* ---------- chart of accounts -------------------------------------------
   Codes are defaults. Every organisation has its own chart, so these are
   overridable per tenant — a council's ledger looks nothing like a small
   company's, and posting to the wrong code is worse than not posting at all.
------------------------------------------------------------------------ */
var DEFAULT_ACCOUNTS = {
  grossPay:          { code: "7000", name: "Gross wages and salaries",     type: "expense"  },
  employerNI:        { code: "7006", name: "Employer National Insurance",  type: "expense"  },
  employerPension:   { code: "7007", name: "Employer pension contributions", type: "expense" },
  employmentAllowance:{ code:"7008", name: "Employment Allowance relief",  type: "expense"  },
  leaveAccrual:      { code: "7010", name: "Holiday pay accrual",          type: "expense"  },

  payeControl:       { code: "2210", name: "PAYE payable to HMRC",         type: "liability" },
  niControl:         { code: "2211", name: "National Insurance payable to HMRC", type: "liability" },
  pensionControl:    { code: "2212", name: "Pension contributions payable", type: "liability" },
  studentLoanControl:{ code: "2213", name: "Student loan deductions payable", type: "liability" },
  netPayControl:     { code: "2220", name: "Net wages payable",            type: "liability" },
  otherDeductions:   { code: "2230", name: "Other deductions payable",     type: "liability" },
  leaveProvision:    { code: "2240", name: "Holiday pay provision",        type: "liability" }
};

/* ============================================================================
   BUILD
   ========================================================================== */
function buildJournal({ run, payslips, employees, schemes = [], period, org = {},
                        accounts = DEFAULT_ACCOUNTS, options = {} }){
  const byId = Object.fromEntries((employees || []).map(e => [e.id, e]));
  const splitByCostCentre = options.splitByCostCentre !== false;

  // Held records were never paid, so they must not appear in the journal.
  const heldIds = new Set(
    (run?.exceptions || [])
      .filter(x => run.decisions?.[x.ref]?.type === "hold")
      .flatMap(x => x.employeeIds || [])
  );
  const paid = (payslips || []).filter(ps => !heldIds.has(ps.employeeId));

  const lines = [];
  const add = (acct, side, amount, costCentre, note) => {
    const v = jp2(amount);
    if(v === 0) return;                       // never post a zero line
    lines.push({
      code: acct.code, account: acct.name, type: acct.type,
      debit:  side === "debit"  ? v : 0,
      credit: side === "credit" ? v : 0,
      costCentre: costCentre || null,
      note: note || null
    });
  };

  /* ---- costs, split by cost centre so a budget holder can see their own --- */
  const buckets = {};
  paid.forEach(ps => {
    const e = byId[ps.employeeId] || {};
    const cc = splitByCostCentre ? (e.costCentre || e.department || "Unallocated") : "All";
    const b = buckets[cc] = buckets[cc] || { gross:0, erNI:0, erPension:0 };
    b.gross      += ps.gross;
    b.erNI       += ps.ni.employer;
    b.erPension  += ps.pension.employer;
  });

  Object.entries(buckets).sort((a,b) => a[0].localeCompare(b[0])).forEach(([cc,b]) => {
    add(accounts.grossPay,        "debit", b.gross,     cc);
    add(accounts.employerNI,      "debit", b.erNI,      cc);
    add(accounts.employerPension, "debit", b.erPension, cc);
  });

  /* ---- Employment Allowance reduces the employer NI cost -----------------
     Posted as a credit against the expense, not as income. It is a relief on
     a cost the organisation would otherwise bear, and treating it as income
     overstates both sides of the profit and loss.
  ------------------------------------------------------------------------- */
  const ea = jp2(run?.reliefs?.employmentAllowanceClaimed || 0);
  if(ea > 0) add(accounts.employerNI, "credit", ea, null, "Employment Allowance claimed");

  /* ---- what is now owed -------------------------------------------------- */
  const owed = paid.reduce((t, ps) => ({
    paye:        t.paye        + ps.paye.tax,
    niEmployee:  t.niEmployee  + ps.ni.employee,
    niEmployer:  t.niEmployer  + ps.ni.employer,
    pensionEe:   t.pensionEe   + ps.pension.employee,
    pensionEr:   t.pensionEr   + ps.pension.employer,
    studentLoan: t.studentLoan + ps.studentLoan.total,
    net:         t.net         + ps.net,
    other:       t.other       + otherDeductionsOn(ps)
  }), { paye:0, niEmployee:0, niEmployer:0, pensionEe:0, pensionEr:0, studentLoan:0, net:0, other:0 });

  Object.keys(owed).forEach(k => owed[k] = jp2(owed[k]));

  add(accounts.payeControl,        "credit", owed.paye,        null, "Income tax deducted");
  // Employee and employer NI go to the same HMRC control account, less the
  // allowance, because that is what actually gets paid over.
  add(accounts.niControl,          "credit", jp2(owed.niEmployee + owed.niEmployer - ea), null,
      ea > 0 ? "Employee and employer NI, net of Employment Allowance" : "Employee and employer NI");
  add(accounts.pensionControl,     "credit", jp2(owed.pensionEe + owed.pensionEr), null,
      "Employee and employer contributions");
  add(accounts.studentLoanControl, "credit", owed.studentLoan,  null, "Student and postgraduate loans");
  add(accounts.otherDeductions,    "credit", owed.other,        null, "Union subscriptions and similar");
  add(accounts.netPayControl,      "credit", owed.net,          null, "Payable by BACS");

  /* ---- optional: holiday pay accrual -------------------------------------
     Untaken leave is a cost already incurred and not yet paid. Public bodies
     must carry it under the CIPFA Code; companies under FRS 102 section 28.
     Off by default because it needs a leave balance to be meaningful.
  ------------------------------------------------------------------------- */
  if(options.leaveAccrual && options.leaveAccrual !== 0){
    const acc = jp2(options.leaveAccrual);
    add(accounts.leaveAccrual,  acc > 0 ? "debit"  : "credit", Math.abs(acc), null,
        acc > 0 ? "Increase in untaken leave" : "Decrease in untaken leave");
    add(accounts.leaveProvision, acc > 0 ? "credit" : "debit",  Math.abs(acc), null,
        "Holiday pay provision movement");
  }

  /* ---- balance ----------------------------------------------------------- */
  const totalDebit  = jp2(lines.reduce((s,l) => s + l.debit,  0));
  const totalCredit = jp2(lines.reduce((s,l) => s + l.credit, 0));
  const difference  = jp2(totalDebit - totalCredit);

  return {
    reference: journalReference(period, org),
    date: period?.payDate || period?.end || null,
    narrative: journalNarrative(period, paid.length, org),
    lines,
    totalDebit, totalCredit, difference,
    balanced: difference === 0,
    employeesIncluded: paid.length,
    employeesHeld: heldIds.size,
    employerCost: jp2(totalDebit)
  };
}

/* Everything deducted that is not tax, NI, pension or a student loan — union
   subscriptions, attachment of earnings orders, and so on.

   Derived by subtraction rather than by inspecting deduction labels. An earlier
   version matched the word "pension" in the label to identify pension lines,
   which silently double-counted any scheme not named "pension" — a customer
   calling theirs "Enhanced scheme" produced a journal that did not balance.
   Arithmetic cannot be fooled by what someone names their scheme. */
function otherDeductionsOn(ps){
  const accounted = (ps.paye ? ps.paye.tax : 0)
                  + (ps.ni ? ps.ni.employee : 0)
                  + (ps.pension ? ps.pension.employee : 0)
                  + (ps.studentLoan ? ps.studentLoan.total : 0);
  return jp2((ps.totalDeductions || 0) - accounted);
}

function journalReference(period, org){
  const p = String(period?.n ?? period?.sequence ?? "").padStart(2,"0");
  const y = (period?.taxYear || "").replace("/","-");
  return "PAY-" + (y || "JRNL") + "-P" + p;
}

function journalNarrative(period, count, org){
  return "Payroll for " + (period?.label || "the period") +
         " — " + count + " employee" + (count === 1 ? "" : "s") +
         (org.shortName ? " (" + org.shortName + ")" : "");
}

/* ============================================================================
   VALIDATION
   A journal that does not balance must never reach an accounting system.
   ========================================================================== */
function validateJournal(journal){
  const problems = [];
  if(!journal.lines.length) problems.push("journal has no lines");
  if(!journal.balanced)
    problems.push("does not balance: debits " + journal.totalDebit.toFixed(2) +
                  " against credits " + journal.totalCredit.toFixed(2) +
                  ", difference " + journal.difference.toFixed(2));
  journal.lines.forEach((l,i) => {
    if(l.debit < 0 || l.credit < 0) problems.push("line " + (i+1) + " has a negative amount");
    if(l.debit > 0 && l.credit > 0) problems.push("line " + (i+1) + " has both a debit and a credit");
    if(l.debit === 0 && l.credit === 0) problems.push("line " + (i+1) + " is empty");
    if(!l.code) problems.push("line " + (i+1) + " has no account code");
  });
  return { valid: problems.length === 0, problems };
}

/* ============================================================================
   OUTPUT FORMATS
   The journal is the same in every case; only the shape of the file changes.
   ========================================================================== */
function journalToCSV(journal){
  const rows = [["Date","Reference","Account code","Account","Cost centre","Description","Debit","Credit"]];
  journal.lines.forEach(l => rows.push([
    journal.date || "", journal.reference, l.code, l.account,
    l.costCentre || "", l.note || journal.narrative,
    l.debit ? l.debit.toFixed(2) : "", l.credit ? l.credit.toFixed(2) : ""
  ]));
  rows.push(["","","","","","TOTAL", journal.totalDebit.toFixed(2), journal.totalCredit.toFixed(2)]);
  return rows.map(r => r.map(c => {
    const s = String(c ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(",")).join("\n");
}

/* Xero's manual journal payload. Xero wants a single signed amount per line:
   positive for a debit, negative for a credit. */
function journalToXero(journal){
  return {
    Narration: journal.narrative,
    Date: journal.date,
    Status: "DRAFT",                 // never post live without a human looking
    LineAmountTypes: "NoTax",
    JournalLines: journal.lines.map(l => ({
      AccountCode: l.code,
      Description: l.note || l.account,
      LineAmount: l.debit > 0 ? l.debit : -l.credit,
      TrackingCategories: l.costCentre
        ? [{ Name: "Cost centre", Option: l.costCentre }] : []
    }))
  };
}

/* Sage 50 nominal ledger import layout. */
function journalToSage(journal){
  const rows = [["Type","Account Reference","Nominal A/C Ref","Date","Reference","Details","Net Amount","Tax Code"]];
  journal.lines.forEach(l => rows.push([
    l.debit > 0 ? "JD" : "JC", "", l.code, formatSageDate(journal.date),
    journal.reference, (l.note || l.account).slice(0,60),
    (l.debit > 0 ? l.debit : l.credit).toFixed(2), "T9"
  ]));
  return rows.map(r => r.join(",")).join("\n");
}

function formatSageDate(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  return d + "/" + m + "/" + y;
}

/* absence.js and leave.js both define serviceMonthsAt and entitlementFor.

var ABSENCE = (function(){

   OCCUPATIONAL ABSENCE
   ----------------------------------------------------------------------------
   Company sick pay and enhanced family leave, on top of the statutory minimum.

       1 to 2 years      8 weeks full,      8 weeks half
       2 to 5 years     13 weeks full,     13 weeks half
       5 years plus     26 weeks full,     26 weeks half

   Four things make this harder than it looks, and each is a place where
   systems get it wrong:

   1. ENTITLEMENT IS CONSUMED, NOT RESET. It is measured over a rolling window
      — usually the twelve months preceding the first day of the current
      absence. Someone off for six weeks in March has less available in
      October. Calculating from the start of the leave year instead is a
      common and expensive error.

   2. SERVICE IS MEASURED AT THE START OF THE ABSENCE, not today. Someone who
      passes five years' service mid-absence does not move up a band partway
      through.

   3. OCCUPATIONAL PAY IS INCLUSIVE OF STATUTORY, NOT ON TOP. Full pay means
      normal pay, of which SSP forms part. Paying both is an overpayment, and
      it is the single most common occupational sick pay mistake.

   4. THE WINDOW IS IN DAYS, THE ENTITLEMENT IN WEEKS, AND THE PAY IN HOURS.

    id, name, kind,
    bands: [...bands].sort((a, b) => a.fromMonths - b.fromMonths),
    windowMonths, windowType,

    // than being paid in addition. Almost always true.

      { fromMonths: 12, fullWeeks: 8,  halfWeeks: 8,  label: "1 to 2 years" },
      { fromMonths: 24, fullWeeks: 13, halfWeeks: 13, label: "2 to 5 years" },

function serviceMonthsAt(startedOn, atDate){

  if(a.getUTCDate() < s.getUTCDate()) months--;

   service threshold mid-absence stays in the band they started in. */
function bandFor(scheme, startedOn, absenceStart){

  for(const b of scheme.bands){
